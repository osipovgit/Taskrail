[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "countersign"
version = "0.17.1"
description = "Reviewed, approval-gated, resumable opencode task workflows"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
readme = "README.md"
dependencies = []

[project.scripts]
countersign = "countersign.__main__:main"

[tool.setuptools.packages.find]
include = ["countersign*"]

[tool.setuptools.package-data]
"countersign.core" = ["*.json"]
"countersign.application" = ["*.md", "*.json"]
"countersign.web" = ["static/*.html", "static/*.js", "static/*.css", "static/modules/*.js"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
