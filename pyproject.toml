[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "countersign"
dynamic = ["version"]
description = "Reviewed, approval-gated, resumable opencode task workflows"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
readme = "README.md"
dependencies = []

[project.scripts]
countersign = "countersign.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "countersign.core.version.VERSION"}

[tool.setuptools.packages.find]
include = ["countersign*"]

[tool.setuptools.package-data]
"countersign" = ["settings.json", "agents/*.md"]
"countersign.core" = ["*.json"]
"countersign.application" = ["*.md", "*.json"]
"countersign.web" = ["static/*.html", "static/*.js", "static/*.css", "static/*.svg", "static/modules/*.js"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
